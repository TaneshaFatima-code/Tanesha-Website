<!DOCTYPE html>
<html>
    <head>
        <title>IOS Calculator</title>
        <link rel="stylesheet" href="styles.css"
        type="text/css"/>
    </head>
    <body>
        <div id="app">
            <div id="screen">
                <h3 id="display-text">0</h3>
            </div>
            <div id="buttons">
                <div class="button-row">
                    <div class="button-wrapper">
                        <button class="light-grey"id="ac">AC</button>
                    </div>
                    <div class="button-wrapper">
                        <button class="light-grey"id="plys-minus">+/-</button>
                    </div>
                    <div class="button-wrapper">
                        <button class="light-grey"id="percent">%</button>
                    </div>
                    <div class="button-wrapper">
                        <button class="orange" id="divide">/</button>
                    </div>
                </div>
                <div class="button-row">
                    <div class="button-wrapper">
                        <button class="dark-grey"id="num7">7</button>
                    </div>
                    <div class="button-wrapper">
                        <button class="dark-grey"id="num8">8</button>
                    </div>
                    <div class="button-wrapper">
                        <button class="dark-grey"id="num9">9</button>
                    </div>
                    <div class="button-wrapper">
                        <button class="orange"id="multiply">X</button>
                    </div>
                </div>
            <div class="button-row">
                <div class="button-wrapper">
                        <button class="dark-grey"id="num4">4</button>
                    </div>
                    <div class="button-wrapper">
                        <button class="dark-grey"id="num5">5</button>
                    </div>
                    <div class="button-wrapper">
                        <button class="dark-grey"id="num6">6</button>
                    </div>
                    <div class="button-wrapper">
                        <button class="orange"id="minus">-</button>
                    </div>
            </div>
            <div class ="button-row">
                <div class="button-wrapper">
                        <button class="dark-grey"id="num1">1</button>
                    </div>
                    <div class="button-wrapper">
                        <button class="dark-grey"id="num2">2</button>
                    </div>
                    <div class="button-wrapper">
                        <button class="dark-grey"id="num3">3</button>
                    </div>
                    <div class="button-wrapper">
                        <button class="orange"id="plus">+</button>
                    </div>
            </div>
            <div class="button-row">
                <div id="zero-wrapper" class="button-wrapper">
                        <button class="dark-grey"id="num0">0</button>
                    </div>
                    <div class="button-wrapper">
                        <button class="dark-grey"id="decimal">.</button>
                    </div>
                    <div class="button-wrapper">
                        <button class="orange"id="equals">=</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="javascript.js"></script>
    </body>
</html>
